<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('pomodoro.theme.v1');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <h1>Pomodoro Timer</h1>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
      <!-- <div class="header-actions">
      </div> -->
    </header>
    <div class="modes">
      <button class="mode-btn active" data-mode="focus">Focus</button>
      <button class="mode-btn" data-mode="short">Short Break</button>
      <button class="mode-btn" data-mode="long">Long Break</button>
    </div>
    <main class="timer-card">
      <svg class="progress-ring" viewBox="0 0 300 300">
        <circle class="progress-ring__bg" cx="150" cy="150" r="135" />
        <circle class="progress-ring__fg" id="ringFg" cx="150" cy="150" r="135" />
      </svg>
      <div class="timer-display">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="session-label" id="sessionLabel">Focus time</div>
        <div class="pomodoroLabel">🍅</div>
      </div>
    </main>
    <div class="controls">
      <button id="resetBtn" class="ctrl-btn secondary" title="Reset">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor" stroke="currentColor" stroke-width="20">
          <path d="M339.5-108.5q-65.5-28.5-114-77t-77-114Q120-365 120-440t28.5-140.5q28.5-65.5 77-114t114-77Q405-800 480-800h6l-62-62 56-58 160 160-160 160-56-58 62-62h-6q-117 0-198.5 81.5T200-440q0 117 81.5 198.5T480-160q117 0 198.5-81.5T760-440h80q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-80q-75 0-140.5-28.5Z" />
        </svg>
      </button>
      <button id="startPauseBtn" class="ctrl-btn primary">Start</button>
      <button id="skipBtn" class="ctrl-btn secondary" title="Skip">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor" stroke="currentColor" stroke-width="15">
          <path d="M100-240v-480l360 240-360 240Zm400 0v-480l360 240-360 240ZM180-480Zm400 0Zm-400 90 136-90-136-90v180Zm400 0 136-90-136-90v180Z" />
        </svg>
      </button>
    </div>
    <div class="pomodoro">
      <div class="pomodoro-count"> Pomodoros completed today: <span id="pomodoroCount"> 0 </span>
      </div>
      <div class="dots" id="pomodoroDots"></div>
    </div>
    <section class="tasks">
      <h2>Tasks</h2>
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="Add a task..." maxlength="120" autocomplete="off" />
        <button type="submit">+</button>
      </form>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </div>
  <div id="settingsOverlay" class="overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <label class="setting-row">
        <span>Focus (min)</span>
        <input type="number" id="focusInput" min="1" max="120" value="25" />
      </label>
      <label class="setting-row">
        <span>Short break (min)</span>
        <input type="number" id="shortInput" min="1" max="60" value="5" />
      </label>
      <label class="setting-row">
        <span>Long break (min)</span>
        <input type="number" id="longInput" min="1" max="90" value="15" />
      </label>
      <label class="setting-row">
        <span>Pomodoros before long break</span>
        <input type="number" id="cyclesInput" min="1" max="12" value="4" />
      </label>
      <label class="setting-row switch-row">
        <span>Auto-start next session</span>
        <input type="checkbox" id="autoStartInput" />
      </label>
      <label class="setting-row switch-row">
        <span>Sound on completion</span>
        <input type="checkbox" id="soundInput" checked />
      </label>
      <button id="saveSettingsBtn" class="ctrl-btn primary full-width">Save</button>
    </div>
  </div>
  <script src="./js/script.js"></script>
</body>
</html>
